name: Nasazení Skicovníku AR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Získat zdrojové soubory
        uses: actions/checkout@v6
      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Nahrát aplikaci
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Nasadit aplikaci
        id: deployment
        uses: actions/deploy-pages@v4
