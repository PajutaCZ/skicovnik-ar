<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101310"><meta name="description" content="Kreslete podle předlohy přes fotoaparát."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Skicovník AR</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#"><span class="logo">✎</span><span>Skicovník <b>AR</b><small>Digitální ateliér</small></span></a><div class="head-actions"><button id="saveBtn" class="icon-btn" title="Uložit projekt">▣</button><button id="projectsBtn" class="icon-btn" title="Projekty">◷</button><button id="installBtn" class="icon-btn" hidden>⇩</button></div></header>
<main><section class="stage-wrap"><div id="stage" class="stage"><video id="video" autoplay playsinline muted></video><div id="empty" class="empty"><div class="empty-icon">▧</div><h2>Začněte svou skicu</h2><p>Nahrajte předlohu nebo zapněte kameru. Vše zůstává ve vašem zařízení.</p><button class="primary" id="pickHero">＋ Vybrat předlohu</button></div><canvas id="overlay"></canvas><canvas id="grid"></canvas><div class="stage-tools"><button id="lockBtn" title="Uzamknout předlohu">♧</button><button id="torchBtn" title="Svítilna" disabled>☼</button><button id="fullBtn" title="Celá obrazovka">⛶</button></div><div class="camera-hint" id="camStatus">Kamera vypnutá</div></div><div class="quickbar"><button id="cameraBtn">◉ <span>Zapnout kameru</span></button><button id="pickBtn">▧ <span>Vybrat obrázek</span></button><button id="flipBtn" disabled>⇄ <span>Přepnout kameru</span></button></div><input type="file" id="file" accept="image/*" hidden></section>
<aside class="controls"><div class="control-head"><div><span class="eyebrow">PRACOVNÍ PANEL</span><h1>Upravte předlohu</h1></div><button id="resetBtn" class="subtle">Reset</button></div><label class="field-title" for="mode">Styl kresby</label><select id="mode"><option value="original">Původní fotografie</option><option value="soft">Jemná skica</option><option value="pencil" selected>Kresba tužkou</option><option value="detail">Detailní skica</option><option value="outline">Jednoduché obrysy</option><option value="edges">Detailní kontury</option><option value="bw">Černobílý obrázek</option></select>
<div class="slider-row"><label for="opacity">Průhlednost předlohy</label><output id="opacityVal">55%</output></div><input id="opacity" type="range" min="5" max="100" value="55">
<div class="slider-row"><label for="detail">Množství detailů</label><output id="detailVal">55%</output></div><input id="detail" type="range" min="0" max="100" value="55">
<div class="slider-row"><label for="strength">Síla čar</label><output id="strengthVal">50%</output></div><input id="strength" type="range" min="0" max="100" value="50">
<div class="slider-row"><label for="contrast">Kontrast</label><output id="contrastVal">50%</output></div><input id="contrast" type="range" min="0" max="100" value="50">
<div class="slider-row"><label for="brightness">Jas</label><output id="brightnessVal">50%</output></div><input id="brightness" type="range" min="0" max="100" value="50">
<div class="divider"></div><div class="section-title"><div><span class="eyebrow">POMOCNÁ MŘÍŽKA</span><strong>Mřížka</strong></div><label class="switch"><input id="gridOn" type="checkbox"><span></span></label></div><div class="grid-settings"><label>Sloupce <input id="cols" type="number" min="1" max="30" value="4"></label><label>Řádky <input id="rows" type="number" min="1" max="30" value="4"></label></div><div class="grid-settings"><label>Barva <input id="gridColor" type="color" value="#e9f5e7"></label><label>Průhlednost <input id="gridOpacity" type="range" min="10" max="100" value="55"></label></div><label class="checkline"><input id="gridFull" type="checkbox"> Mřížka přes celou plochu</label>
<div class="divider"></div><div class="section-title"><div><span class="eyebrow">VÝSTUP</span><strong>Export a tisk</strong></div></div><div class="button-row"><button id="exportBtn" class="secondary">↓ Export PNG</button><button id="printBtn" class="secondary">▤ Tisk A4</button></div><p class="privacy">✦ Vaše fotografie neopouští toto zařízení.</p></aside></main><div class="toast" id="toast"></div>
<script src="app.js"></script></body></html>
